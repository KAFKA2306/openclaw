name: KAFKA branch hygiene

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: kafka-openclaw-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'KAFKA2306/openclaw'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete branches that are not open PR heads
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repositoryFullName = `${owner}/${repo}`;
            const repository = await github.rest.repos.get({ owner, repo });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const allowed = new Set([repository.data.default_branch]);
            for (const pull of openPulls) {
              if (pull.head.repo?.full_name === repositoryFullName) {
                allowed.add(pull.head.ref);
              }
            }
            for (const branch of branches) {
              if (branch.protected) {
                allowed.add(branch.name);
              }
            }

            const orphaned = branches
              .map((branch) => branch.name)
              .filter((branch) => !allowed.has(branch));

            for (const branch of orphaned) {
              core.info(`Deleting orphan branch: ${branch}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
            }

            core.notice(
              `Branch hygiene complete: kept ${allowed.size} allowed/protected branch(es), deleted ${orphaned.length} orphan branch(es).`,
            );
