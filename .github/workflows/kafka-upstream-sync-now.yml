name: KAFKA upstream sync now

on:
  push:
    branches:
      - automation/upstream-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: automation/upstream-sync

      - name: Merge current upstream main and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch --no-tags upstream main
          git merge --no-edit upstream/main
          git rm .github/workflows/kafka-upstream-sync-now.yml
          git commit -m "ci(kafka): remove one-shot upstream sync trigger"
          git push origin HEAD:automation/upstream-sync
